<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Texty</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-one"></div>
    <div class="bg-orb orb-two"></div>
    <main class="app-shell">
      <aside class="panel glass">
        <h1 class="brand">Texty</h1>
        <p class="subtle">Realtime messaging + voice/video calls</p>
        <label class="field">
          <span>Username</span>
          <input id="nameInput" type="text" maxlength="30" placeholder="username" />
        </label>
        <label class="field">
          <span>Password</span>
          <input id="passwordInput" type="password" maxlength="64" placeholder="password (min 6 chars)" />
        </label>
        <div class="actions auth-actions">
          <button id="registerBtn" class="btn">Register</button>
          <button id="loginBtn" class="btn btn-primary">Login</button>
          <button id="logoutBtn" class="btn btn-danger">Logout</button>
        </div>
        <p id="authStatus" class="subtle">Not logged in</p>
        <label class="field">
          <span>Room</span>
          <input id="roomInput" type="text" maxlength="40" value="general" />
        </label>
        <button id="joinBtn" class="btn btn-primary">Join Room</button>
        <div class="divider"></div>
        <h2>Participants</h2>
        <ul id="participantsList" class="participants"></ul>
      </aside>

      <section class="panel glass chat-panel">
        <div class="chat-header">
          <h2 id="currentRoomLabel">Room: -</h2>
          <span id="statusBadge" class="badge">Disconnected</span>
        </div>
        <div id="messages" class="messages"></div>
        <div class="composer">
          <input id="messageInput" type="text" placeholder="Type your message..." maxlength="400" />
          <button id="sendBtn" class="btn">Send</button>
        </div>
      </section>

      <aside class="panel glass calls-panel">
        <h2>Calls</h2>
        <label class="field">
          <span>Call Target</span>
          <select id="targetSelect"></select>
        </label>

        <div class="call-box">
          <h3>Voice Call</h3>
          <p id="voiceStatus" class="subtle">Idle</p>
          <div class="actions">
            <button id="voiceCallBtn" class="btn">Start</button>
            <button id="voiceHangupBtn" class="btn btn-danger">Hang Up</button>
          </div>
          <audio id="voiceRemoteAudio" autoplay></audio>
        </div>

        <div class="call-box">
          <h3>Video Call</h3>
          <p id="videoStatus" class="subtle">Idle</p>
          <div class="actions">
            <button id="videoCallBtn" class="btn">Start</button>
            <button id="videoHangupBtn" class="btn btn-danger">Hang Up</button>
          </div>
          <div class="video-grid">
            <video id="localVideo" autoplay muted playsinline></video>
            <video id="remoteVideo" autoplay playsinline></video>
          </div>
        </div>
      </aside>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
